[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemdata-auditor"
version = "0.1.0"
description = "Explicit dataset audits and scientific train/test splits"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
chem = ["rdkit>=2023.9"]
dev = ["pytest>=8"]

[project.scripts]
chemdata = "chemdata_auditor.cli:main"
scisplit = "chemdata_auditor.cli:split_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
